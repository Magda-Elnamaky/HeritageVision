<!doctype html>
<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,"Segoe UI",sans-serif;color:#12384a}
.planet-card{height:370px;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;
  border:1px solid #d2e5e9;border-radius:24px;background:radial-gradient(ellipse at 50% 42%,#fff 0,#eaf6f7 52%,#dcecef 100%)}
.globe{position:absolute;width:min(96vw,440px);aspect-ratio:1;border-radius:50%;
  background:radial-gradient(ellipse at 34% 27%,rgba(255,255,255,.95) 0 6%,transparent 35%),
  radial-gradient(ellipse at 52% 48%,#74c9c2 0,#269ba3 42%,#0b5a6b 80%);
  box-shadow:inset -22px -12px 44px rgba(4,44,63,.42),0 16px 35px rgba(13,78,98,.22);
  border:1px solid rgba(255,255,255,.85)}
.globe:before{content:"";position:absolute;inset:8%;border-radius:50%;
  background:radial-gradient(ellipse at 25% 40%,rgba(247,217,139,.78) 0 9%,transparent 10%),
  radial-gradient(ellipse at 67% 56%,rgba(247,217,139,.68) 0 12%,transparent 13%),
  radial-gradient(ellipse at 52% 24%,rgba(247,217,139,.56) 0 7%,transparent 8%),
  repeating-linear-gradient(90deg,transparent 0 19%,rgba(255,255,255,.14) 19.4% 19.8%,transparent 20.2% 39.5%)}
.globe:after{content:"";position:absolute;inset:5% 16%;border:1px solid rgba(255,255,255,.23);border-radius:50%;
  box-shadow:0 0 0 24px rgba(255,255,255,.035),0 0 0 48px rgba(255,255,255,.025)}
.planet-title{position:absolute;z-index:2;top:12px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:999px;
  color:#fff;background:rgba(8,57,75,.76);font-size:13px;font-weight:700;white-space:nowrap;max-width:90%;overflow:hidden;text-overflow:ellipsis}
.feature-grid{position:relative;z-index:3;width:min(78%,360px);height:70%;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));
  grid-template-rows:repeat(3,minmax(0,1fr));gap:9px}
.feature{min-width:0;border:1px solid rgba(255,255,255,.7);border-inline-start:4px solid var(--tone);
  border-radius:14px;padding:7px 10px;text-align:start;color:#fff;background:rgba(10,54,76,.82);
  box-shadow:0 5px 14px rgba(0,26,46,.2);backdrop-filter:blur(5px);cursor:pointer;transition:transform .16s,background .16s,border-color .16s}
.feature:hover,.feature:focus-visible{transform:translateY(-2px);background:rgba(8,66,84,.96);outline:2px solid #ffe08a;outline-offset:1px}
.feature.active{background:var(--tone);border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.6),0 7px 18px rgba(0,26,46,.25)}
.feature strong{display:block;font-size:12px;line-height:1.28;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.feature small{display:block;margin-top:4px;color:rgba(255,255,255,.83);font-size:10px;line-height:1.25;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
@media(max-width:520px){.planet-card{height:360px}.feature-grid{width:84%;height:72%;gap:7px}.feature{padding:6px 7px}.feature strong{font-size:11px}.feature small{font-size:9px}}
</style></head><body>
<div class="planet-card"><div class="globe"></div><div class="planet-title" id="planet-title"></div><div class="feature-grid" id="features"></div></div>
<script>
const send=(type,extra)=>window.parent.postMessage(Object.assign({isStreamlitMessage:true,type},extra),"*");
function render(args){
  const title=document.getElementById("planet-title");
  title.textContent=args.country||"";
  const grid=document.getElementById("features");
  grid.replaceChildren();
  (args.features||[]).forEach(feature=>{
    const button=document.createElement("button");
    button.type="button";
    button.className="feature"+(feature.id===args.selected?" active":"");
    button.dir="auto";
    button.style.setProperty("--tone",feature.color||"#2f93bf");
    const label=document.createElement("strong");
    label.textContent=feature.title||"";
    const detail=document.createElement("small");
    detail.textContent=feature.detail||"";
    button.append(label,detail);
    button.setAttribute("aria-pressed",String(feature.id===args.selected));
    button.addEventListener("click",()=>send("streamlit:setComponentValue",{value:feature.id}));
    grid.append(button);
  });
}
send("streamlit:componentReady",{apiVersion:1});
send("streamlit:setFrameHeight",{height:374});
window.addEventListener("message",event=>{
  if(event.data&&event.data.type==="streamlit:render")render(event.data.args||{});
});
</script></body></html>
